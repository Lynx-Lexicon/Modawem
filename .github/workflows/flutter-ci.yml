name: Flutter CI

on:
  push:
    branches: [main]
    paths:
     - 'apps/mobile/**'
  pull_request:
    branches: [main]
    paths:
    - 'apps/mobile/**'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build APK (Development)
        working-directory: apps/mobile
        run: |
          flutter build apk --debug --dart-define=ENV=dev --dart-define=API_BASE_URL=http://10.0.2.2:3000

          