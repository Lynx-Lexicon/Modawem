[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modawem-medication-management"
version = "0.1.0"
description = "Medication adherence calculations for PDC and MPR"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
	"pylint>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
source-roots = ["src"]
